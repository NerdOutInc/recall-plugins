schema_version: "1.1"
name: 03-writes-rejected
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Write `csv2json.py` in the current directory. It converts a CSV file to a JSON array of objects using the header row as keys, and takes an optional `--indent N` argument. Just write the file — no need to run it.

    Record this work in the Recall journal as you go.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Write]
  model: sonnet
  append_system_prompt: "The user's Recall journal destination is workspace id ws-eval-personal (name: Personal) and Recall Project id proj-eval-ai (name: AI). Use those ids directly."
runs: 3
