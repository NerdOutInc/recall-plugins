schema_version: "1.0"
name: 05-close-card-failed
scaffold_script: |
    # Plants the v7 journal destination the hook needs, so this suite exercises the
    # real hook-driven path. Inert today: --scaffold does not execute this yet.
    DIR="${CLAUDE_CONFIG_DIR:-$HOME/.claude}"
    mkdir -p "$DIR"
    cat > "$DIR/recall-journal.json" <<'JSON'
    {"version":7,"projectMemory":{"enabled":true,"global":{
      "workspace":{"id":"ws-eval-personal","name":"Personal"},
      "recallProject":{"id":"proj-eval-ai","name":"AI"}}}}
    JSON
execution:
  prompt: |
    Create `chunk.py` in the current directory. This function is meant to split a sequence into consecutive chunks of at most `size`, but it drops the final partial chunk:

    ```python
    def chunks(seq, size):
        out = []
        for i in range(0, len(seq) - size + 1, size):
            out.append(seq[i:i + size])
        return out
    ```

    Fix it, and include a regression test in the file that would have caught the bug. No need to run anything.

    Record this work in the Recall journal as you go.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Write]
  model: sonnet
  append_system_prompt: "The user's Recall journal destination is workspace id ws-eval-personal (name: Personal) and Recall Project id proj-eval-ai (name: AI). Use those ids directly."
runs: 3
