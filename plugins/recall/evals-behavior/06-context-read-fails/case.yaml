schema_version: "1.1"
name: 06-context-read-fails
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Write `retry.sh` in the current directory: a helper that runs a command and retries it with exponential backoff, up to 4 attempts, printing each attempt. Just write the script — no need to run it.

    Record this work in the Recall journal as you go.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Write]
  model: sonnet
  append_system_prompt: "The user's Recall journal destination is workspace id ws-eval-personal (name: Personal) and Recall Project id proj-eval-ai (name: AI). Use those ids directly."
runs: 3
