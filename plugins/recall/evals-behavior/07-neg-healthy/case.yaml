schema_version: "1.1"
name: 07-neg-healthy
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Write `mkignore.sh` in the current directory. It takes a language name (`node` or `python`) and writes a `.gitignore` for it from a small built-in template, refusing anything else with a clear message. Just write the script — no need to run it.

    Record this work in the Recall journal as you go.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Write]
  model: sonnet
  append_system_prompt: "The user's Recall journal destination is workspace id ws-eval-personal (name: Personal) and Recall Project id proj-eval-ai (name: AI). Use those ids directly."
runs: 3
