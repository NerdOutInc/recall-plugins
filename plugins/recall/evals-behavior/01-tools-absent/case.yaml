schema_version: "1.1"
name: 01-tools-absent
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Write a shell script `wordfreq.sh` in the current directory. It takes a file path as its argument and prints the 10 most frequent words, one per line as `count word`, lowercased and ignoring punctuation. Just write the script — no need to run it.

    Record this work in the Recall journal as you go.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Write]
  model: sonnet
  append_system_prompt: "The user's Recall journal destination is workspace id ws-eval-personal (name: Personal) and Recall Project id proj-eval-ai (name: AI). Use those ids directly."
runs: 3
