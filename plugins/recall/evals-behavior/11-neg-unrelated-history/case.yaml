schema_version: "1.1"
name: 11-neg-unrelated-history
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Write `contrast.py` in the current directory. It takes two hex colours like `#1a1a1a` and `#ffffff`, computes the WCAG 2.1 contrast ratio between them, and prints the ratio plus whether it passes AA (4.5:1) and AAA (7:1) for normal text.

    Record this work in the Recall journal as you go.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Write]
  model: sonnet
  append_system_prompt: "The user's Recall journal destination is workspace id ws-eval-personal (name: Personal) and Recall Project id proj-eval-ai (name: AI). Use those ids directly."
runs: 3
