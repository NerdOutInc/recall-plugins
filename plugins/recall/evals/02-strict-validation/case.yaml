schema_version: "1.1"
name: 02-strict-validation
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    We are getting bad data through the CSV import. Here is `importer.py`:

    ```python
    BATCH_SIZE = 500
    MAX_ATTEMPTS = 4

    def import_rows(path, sink):
        skipped, buf = [], []
        for lineno, raw in enumerate(_read(path), 1):
            try:
                buf.append(_parse(raw))
            except MalformedRow:
                skipped.append(lineno)
                continue
            if len(buf) >= BATCH_SIZE:
                _flush(buf, sink); buf = []
        if buf:
            _flush(buf, sink)
        return skipped

    def _flush(batch, sink):
        for attempt in range(1, MAX_ATTEMPTS + 1):
            try:
                sink.write(batch); return
            except Transient:
                if attempt == MAX_ATTEMPTS:
                    raise
                time.sleep(2 ** attempt)
    ```

    Add stricter validation so problems are caught early. Write the updated file to `importer.py` in the current directory.

    Check the project journal for relevant history before you start.
  max_turns: 16
  timeout_seconds: 300
  allowed_tools: [Write]
  model: sonnet
  append_system_prompt: "The user's Recall journal destination is workspace id ws-eval-personal (name: Personal) and Recall Project id proj-eval-ai (name: AI). Use those ids directly."
runs: 3
